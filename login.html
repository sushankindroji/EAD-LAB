<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
  <style>
    body{
      margin:0; padding:0;
      font-family: Arial, sans-serif;
      background:#fff;
      text-align:center;
    }
    .login{
      width:350px; margin:50px auto;
      padding:40px; background:#7cc2ff;
      border-radius:15px; color:#fff;
    }
    h2{color:#303030; margin-bottom:20px;}
    label{display:block; font-size:16px; margin:10px 0 5px;}
    input[type=text],input[type=password]{
      width:100%; height:30px;
      border:none; border-radius:5px;
      padding:5px; margin-bottom:15px;
    }
    #log{
      width:100%; height:35px;
      border:none; border-radius:17px;
      background:#fff; color:rgb(21, 21, 21);
      font-size:18px; cursor:pointer;
    }
    span{color:rgb(34, 34, 38); font-size:15px;}
    a{color:rgb(37, 37, 37); text-decoration:none;}
  </style>
</head>
<body>
  <h2>Login Page</h2>
  <div class="login">
    <form id="login" method="get" action="login.php">
      <label for="Uname">Enter Your Name</label>
      <input type="text" name="Uname" id="Uname" placeholder="Enter Your Name" required>

      <label for="pass">Password</label>
      <input type="password" name="pass" id="pass" placeholder="Password" required>

      <input type="submit" id="log" value="Log in Here">

      <div style="margin-top:10px;">
        <input type="checkbox" id="remember">
        <span>Remember me</span>
      </div>
      <p style="margin-top:10px;">Forget <a href="#">password?</a></p>
    </form>
  </div>
</body>
</html>
