<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Board</title>
<style>
  body{display:flex;justify-content:center;align-items:center;height:100vh;background:#333;margin:0}
  #chessboard{display:grid;grid-template:repeat(8,60px)/repeat(8,60px);border:4px solid #222}
  .square{display:flex;justify-content:center;align-items:center;font:36px "Segoe UI Symbol",sans-serif;cursor:pointer}
  .light{background:#fff}.dark{background:#777}
</style>
</head>
<body>
<div id="chessboard"></div>
<script>
const board=document.getElementById("chessboard"),
pieces={w:["♖","♘","♗","♕","♔","♗","♘","♖"],wp:"♙",b:["♜","♞","♝","♛","♚","♝","♞","♜"],bp:"♟"};
for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const s=document.createElement("div");
  s.className=`square ${(r+c)%2?"dark":"light"}`;
  if(r===0)s.textContent=pieces.b[c];
  else if(r===1)s.textContent=pieces.bp;
  else if(r===6)s.textContent=pieces.wp;
  else if(r===7)s.textContent=pieces.w[c];
  board.appendChild(s);
}
</script>
</body>
</html>
